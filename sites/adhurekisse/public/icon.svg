<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark cinematic background -->
  <rect width="512" height="512" rx="128" fill="#0A0814" />
  
  <!-- Outer Glow / Ring 1 -->
  <circle cx="256" cy="256" r="200" stroke="url(#gradient-outer)" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="256" r="180" stroke="#FFFFFF" stroke-width="2" opacity="0.1" />
  
  <!-- The Vinyl Grooves -->
  <circle cx="256" cy="256" r="140" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
  <circle cx="256" cy="256" r="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />
  <circle cx="256" cy="256" r="100" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
  
  <!-- Vinyl Center Label -->
  <circle cx="256" cy="256" r="70" fill="url(#gradient-inner)" />
  <circle cx="256" cy="256" r="20" fill="#0A0814" />
  
  <!-- Stylized "AK" in the center -->
  <path d="M220 280 L236 230 L252 280 M228 260 L244 260 M265 280 L265 230 M265 255 L285 230 M265 255 L285 280" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <defs>
    <linearGradient id="gradient-outer" x1="56" y1="56" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#D4A8F9" />
    </linearGradient>
    <linearGradient id="gradient-inner" x1="186" y1="186" x2="326" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D2B3D" />
      <stop offset="1" stop-color="#1E1C2B" />
    </linearGradient>
  </defs>
</svg>
